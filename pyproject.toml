[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "playpen"
version = "3.7.0" # matches least required clemcore version
description = "The Playpen Python package to train LLMs interactively in text-based environments."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Philipp Sadler", email = "first.last@uni-potsdam.de" }
]
dependencies = [
    "clemcore>=3.7.0,<4.0.0",
    "torch>=2.10.0",
    "flash-attn==2.8.3",
    "skyrl[ray,skyrl-train,fsdp]",
    "datasets>=3.5.1,<5.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "langdetect>=1.0.9,<2.0.0",
    "immutabledict>=4.2.1,<5.0.0",
    "lark>=1.1.9,<2.0.0",
    "clingo>=5.7.1,<6.0.0",
    "spacy>=3.7.4,<4.0.0",
    "nltk>=3.9.2,<4.0.0",
    "scikit-learn>=1.9.0",
    "matplotlib>=3.11.0",
    "networkx>=3.6.1",
    "imageio>=2.37.3",
    "numpy>=2.3.5",
    "levenshtein>=0.27.3",
    "kaggle>=2.2.3",
    "gymnasium>=1.3.0",
    "pygame>=2.6.1",
    "sympy>=1.14.0",
]

[project.scripts]
playpen = "playpen.cli:main"

[project.urls]
Homepage = "https://github.com/lm-playpen/playpen"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["build", "dist", "venv", "examples", "clembench"]

[tool.uv.sources]
flashinfer-jit-cache = { index = "flashinfer-cu128" }
torch = { index = "pytorch-cu128" }
skyrl = { git = "https://github.com/novasky-ai/SkyRL.git" }

[tool.uv.extra-build-dependencies]
flash-attn = [{requirement = "torch", match-runtime = true}]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE" }

[[tool.uv.index]]
name = "flashinfer-cu128"
url = "https://flashinfer.ai/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

